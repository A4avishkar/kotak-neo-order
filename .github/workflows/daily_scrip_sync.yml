name: Daily Scrip Master Sync

on:
  # Run every day at 8:00 AM IST (2:30 AM UTC) - after Kotak updates their scrip master
  schedule:
    - cron: '30 2 * * *'
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-scrip-master:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pyotp urllib3

      - name: Create credentials file (b.txt)
        run: |
          cat > python_scripts/b.txt << 'EOF'
          consumer_key=${{ secrets.KOTAK_CONSUMER_KEY }}
          consumer_secret=${{ secrets.KOTAK_CONSUMER_SECRET }}
          access_token=${{ secrets.KOTAK_ACCESS_TOKEN }}
          view_token=${{ secrets.KOTAK_VIEW_TOKEN }}
          sid=${{ secrets.KOTAK_SID }}
          ucc=${{ secrets.KOTAK_UCC || secrets.KOTAK_SID }}
          server_id=${{ secrets.KOTAK_SERVER_ID }}
          mobile_number=${{ secrets.KOTAK_MOBILE_NUMBER || secrets.KOTAK_MOBILE }}
          password=${{ secrets.KOTAK_PASSWORD }}
          mpin=${{ secrets.KOTAK_MPIN }}
          totp_secret=${{ secrets.KOTAK_TOTP_SECRET }}
          KOTAK_CONSUMER_KEY=${{ secrets.KOTAK_CONSUMER_KEY }}
          KOTAK_MOBILE_NUMBER=${{ secrets.KOTAK_MOBILE_NUMBER || secrets.KOTAK_MOBILE }}
          KOTAK_UCC=${{ secrets.KOTAK_UCC || secrets.KOTAK_SID }}
          KOTAK_MPIN=${{ secrets.KOTAK_MPIN }}
          KOTAK_TOTP_SECRET=${{ secrets.KOTAK_TOTP_SECRET }}
          EOF

      - name: Download Scrip Master CSVs from Kotak
        run: |
          mkdir -p scrip_masters
          cd python_scripts
          python download_scrip_master.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Upload to Supabase
        run: |
          cd python_scripts
          python upload_to_supabase.py
        env:
          PYTHONUNBUFFERED: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Commit and push updated scrip master files to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f scrip_masters/
          if git diff --staged --quiet; then
            echo "No changes in scrip_master files to commit."
          else
            git commit -m "chore: auto-update daily scrip master files [skip ci]"
            git push
          fi

      - name: Sync complete
        run: |
          echo "✅ Scrip Master sync completed at $(date)"
          echo "Supabase and GitHub repo have been updated with today's latest F&O scrip data."
